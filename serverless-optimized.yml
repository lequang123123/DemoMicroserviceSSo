service: microservice-auth-v2

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  # Default settings for all functions
  memorySize: 128
  timeout: 30
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    USERS_TABLE: !Ref UsersTable
    AUTH_CODES_TABLE: ${self:provider.stage}-auth-codes
    SESSIONS_TABLE: ${self:provider.stage}-auth-sessions
  apiGateway:
    shouldStartNameWithService: true
    cors:
      origin: '*'
      headers:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
      allowCredentials: true
      maxAge: 86400
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
            - cognito-idp:InitiateAuth
            - cognito-idp:RespondToAuthChallenge
          Resource: "arn:aws:cognito-idp:${self:provider.region}:*:userpool/*"
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: "arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-*"
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:DeleteItem
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-auth-codes"

# Individual packaging for each function
package:
  individually: true
  excludeDevDependencies: true
  patterns:
    # Global exclusions
    - '!README.md'
    - '!guideline.md'
    - '!DEPLOYMENT.md'
    - '!env.*'
    - '!serverless*.yml'
    - '!.git/**'
    - '!.serverless/**'
    - '!.eslintrc.*'
    - '!jest.config.*'
    - '!coverage/**'
    - '!*.test.js'
    - '!*.spec.js'
    - '!buildspec.yml'
    - '!node_modules/.cache/**'
    - '!node_modules/.bin/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/docs/**'
    - '!node_modules/**/example/**'
    - '!node_modules/**/examples/**'
    - '!node_modules/**/*.md'
    - '!node_modules/**/*.txt'
    - '!node_modules/**/LICENSE*'
    - '!node_modules/**/CHANGELOG*'

# Lambda Layers for shared dependencies
layers:
  commonDependencies:
    path: layers/common-dependencies
    name: ${self:provider.stage}-common-dependencies
    description: Common dependencies for auth and user services
    compatibleRuntimes:
      - nodejs18.x
    retain: false

functions:
  healthCheck:
    handler: lambda/health-check/health-check.handler
    layers:
      - { Ref: CommonDependenciesLambdaLayer }
    package:
      patterns:
        - '!**'
        - 'lambda/health-check/health-check.js'
        - 'shared/aws-config.js'
    events:
      - http:
          path: /health
          method: get
          cors: true

  # Lambda Authorizer for OAuth2 JWT validation
  cognitoAuthorizer:
    handler: lambda/cognito-authorizer/cognito-authorizer.handler
    layers:
      - { Ref: CommonDependenciesLambdaLayer }
    package:
      patterns:
        - '!**'
        - 'lambda/cognito-authorizer/cognito-authorizer.js'
        - 'shared/aws-config.js'

  # 🔐 Authentication Service - Core OAuth2 + SSO functionality
  authService:
    handler: lambda/auth-service-minimal/auth-service-minimal.handler
    layers:
      - { Ref: CommonDependenciesLambdaLayer }
    package:
      patterns:
        - '!**'
        - 'lambda/auth-service-minimal/auth-service-minimal.js'
        - 'shared/aws-config.js'
    environment:
      SESSIONS_TABLE: !Ref SessionsTable
      DOMAIN_NAME: ${self:custom.domain}
    events:
      # Public endpoints (no auth needed)
      - http:
          path: /auth/test
          method: get
          cors: true
      - http:
          path: /auth/register
          method: post
          cors: true
      - http:
          path: /auth/login
          method: post
          cors: true
      # OAuth2 endpoints
      - http:
          path: /oauth2/authorize
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
            maxAge: 86400
      - http:
          path: /oauth2/token
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
            maxAge: 86400
      - http:
          path: /oauth2/callback
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
            maxAge: 86400
      - http:
          path: /oauth2/refresh
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
            maxAge: 86400
      # Protected endpoints (requires JWT)
      - http:
          path: /auth/profile
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300
      - http:
          path: /auth/logout
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300

  # New userinfo endpoint
  userinfoEndpoint:
    handler: lambda/userinfo-endpoint/userinfo-endpoint.handler
    layers:
      - { Ref: CommonDependenciesLambdaLayer }
    package:
      patterns:
        - '!**'
        - 'lambda/userinfo-endpoint/userinfo-endpoint.js'
        - 'shared/aws-config.js'
    events:
      - http:
          path: /oauth2/userinfo
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300

  # 👤 User Management Service - User CRUD operations
  userService:
    handler: lambda/user-service/user-service.handler
    layers:
      - { Ref: CommonDependenciesLambdaLayer }
    environment:
      USERS_TABLE_NAME: ${self:provider.stage}-auth-users
    package:
      patterns:
        - '!**'
        - 'lambda/user-service/user-service.js'
        - 'shared/aws-config.js'
    events:
      # Protected endpoints (SSO - requires JWT from any OAuth2 client)
      - http:
          path: /users
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300
      - http:
          path: /users/{id}
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300
      - http:
          path: /users
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300
      - http:
          path: /users/{id}
          method: put
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300
      - http:
          path: /users/{id}
          method: delete
          cors: true
          authorizer:
            name: cognitoAuthorizer
            resultTtlInSeconds: 300

resources:
  Resources:
    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:provider.stage}-user-pool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
            RequireUppercase: true
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true

    # Cognito User Pool Client
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:provider.stage}-user-pool-client
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
        AllowedOAuthFlows:
          - implicit
          - code
        AllowedOAuthScopes:
          - phone
          - email
          - openid
          - profile
        CallbackURLs:
          - http://localhost:3000/callback
        LogoutURLs:
          - http://localhost:3000/logout
        AllowedOAuthFlowsUserPoolClient: true
        PreventUserExistenceErrors: ENABLED
        RefreshTokenValidity: 30
        AccessTokenValidity: 1
        IdTokenValidity: 1
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

    # Cognito User Pool Domain
    CognitoUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        Domain: ${self:provider.stage}-auth-domain
        UserPoolId: !Ref CognitoUserPool

    # Users Table
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stage}-users
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Sessions Table
    SessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stage}-auth-sessions
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: accessToken
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: AccessTokenIndex
            KeySchema:
              - AttributeName: accessToken
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

  Outputs:
    ApiGatewayUrl:
      Description: API Gateway endpoint URL for auth and user services
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - Ref: AWS::Region
            - ".amazonaws.com/"
            - ${self:provider.stage}
      Export:
        Name: ${self:provider.stage}-auth-ApiGatewayUrl
    
    UserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:provider.stage}-auth-UserPoolId
    
    UserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:provider.stage}-auth-UserPoolClientId
    
    UsersTableName:
      Description: DynamoDB Users Table Name
      Value: !Ref UsersTable
      Export:
        Name: ${self:provider.stage}-auth-UsersTableName

plugins:
  - serverless-offline 

custom:
  domain: api.example.com # Replace with your domain
  # Add other custom variables here 