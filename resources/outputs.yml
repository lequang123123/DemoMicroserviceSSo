Outputs:
  # Khai báo output cho Cognito - xuất thông tin các tài nguyên Cognito để các service khác sử dụng
  UserPoolId:
    Description: Cognito User Pool ID # Mô tả output
    Value: !Ref CognitoUserPool # Lấy giá trị ID của User Pool
    Export:
      Name: ${self:service}-${self:provider.stage}-UserPoolId # Tên export để import từ stack khác

  UserPoolClientId:
    Description: Cognito User Pool Client ID # Mô tả output
    Value: !Ref CognitoUserPoolClient # Lấy giá trị ID của User Pool Client
    Export:
      Name: ${self:service}-${self:provider.stage}-UserPoolClientId # Tên export để import từ stack khác

  UserPoolDomain:
    Description: Cognito User Pool Domain # Mô tả output
    Value: !Ref CognitoUserPoolDomain # Lấy giá trị domain của User Pool
    Export:
      Name: ${self:service}-${self:provider.stage}-UserPoolDomain # Tên export để import từ stack khác

  UserPoolArn:
    Description: Cognito User Pool ARN # Mô tả output
    Value: !GetAtt CognitoUserPool.Arn # Lấy ARN của User Pool
    Export:
      Name: ${self:service}-${self:provider.stage}-UserPoolArn # Tên export để import từ stack khác

  IdentityPoolId:
    Description: Cognito Identity Pool ID # Mô tả output
    Value: !Ref CognitoIdentityPool # Lấy giá trị ID của Identity Pool
    Export:
      Name: ${self:service}-${self:provider.stage}-IdentityPoolId # Tên export để import từ stack khác

  # Khai báo output cho API Gateway - xuất thông tin API Gateway
  ApiGatewayRestApiId:
    Description: API Gateway REST API ID # Mô tả output
    Value: !Ref ApiGatewayRestApi # Lấy giá trị ID của API Gateway
    Export:
      Name: ${self:service}-${self:provider.stage}-ApiGatewayRestApiId # Tên export để import từ stack khác

  ApiGatewayRestApiUrl:
    Description: API Gateway REST API URL # Mô tả output
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}' # Tạo URL đầy đủ của API
    Export:
      Name: ${self:service}-${self:provider.stage}-ApiGatewayRestApiUrl # Tên export để import từ stack khác

  ApiGatewayDomainName:
    Description: API Gateway Domain Name # Mô tả output
    Value: !Sub '${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com' # Tạo domain name của API
    Export:
      Name: ${self:service}-${self:provider.stage}-ApiGatewayDomainName # Tên export để import từ stack khác

  # Khai báo output cho DynamoDB - xuất thông tin các bảng DynamoDB
  UsersTableName:
    Description: Users DynamoDB Table Name # Mô tả output
    Value: !Ref UsersTable # Lấy tên bảng Users
    Export:
      Name: ${self:service}-${self:provider.stage}-UsersTableName # Tên export để import từ stack khác

  UsersTableArn:
    Description: Users DynamoDB Table ARN # Mô tả output
    Value: !GetAtt UsersTable.Arn # Lấy ARN của bảng Users
    Export:
      Name: ${self:service}-${self:provider.stage}-UsersTableArn # Tên export để import từ stack khác

  OrdersTableName:
    Description: Orders DynamoDB Table Name # Mô tả output
    Value: !Ref OrdersTable # Lấy tên bảng Orders
    Export:
      Name: ${self:service}-${self:provider.stage}-OrdersTableName # Tên export để import từ stack khác

  OrdersTableArn:
    Description: Orders DynamoDB Table ARN # Mô tả output
    Value: !GetAtt OrdersTable.Arn # Lấy ARN của bảng Orders
    Export:
      Name: ${self:service}-${self:provider.stage}-OrdersTableArn # Tên export để import từ stack khác

  ProductsTableName:
    Description: Products DynamoDB Table Name # Mô tả output
    Value: !Ref ProductsTable # Lấy tên bảng Products
    Export:
      Name: ${self:service}-${self:provider.stage}-ProductsTableName # Tên export để import từ stack khác

  ProductsTableArn:
    Description: Products DynamoDB Table ARN # Mô tả output
    Value: !GetAtt ProductsTable.Arn # Lấy ARN của bảng Products
    Export:
      Name: ${self:service}-${self:provider.stage}-ProductsTableArn # Tên export để import từ stack khác

  SessionsTableName:
    Description: Sessions DynamoDB Table Name # Mô tả output
    Value: !Ref SessionsTable # Lấy tên bảng Sessions
    Export:
      Name: ${self:service}-${self:provider.stage}-SessionsTableName # Tên export để import từ stack khác

  SessionsTableArn:
    Description: Sessions DynamoDB Table ARN # Mô tả output
    Value: !GetAtt SessionsTable.Arn # Lấy ARN của bảng Sessions
    Export:
      Name: ${self:service}-${self:provider.stage}-SessionsTableArn # Tên export để import từ stack khác

  # Khai báo output cho Lambda Functions - xuất thông tin các hàm Lambda
  UserServiceLambdaFunctionArn:
    Description: User Service Lambda Function ARN # Mô tả output
    Value: !GetAtt UserServiceLambdaFunction.Arn # Lấy ARN của hàm User Service
    Export:
      Name: ${self:service}-${self:provider.stage}-UserServiceLambdaFunctionArn # Tên export để import từ stack khác

  OrderServiceLambdaFunctionArn:
    Description: Order Service Lambda Function ARN # Mô tả output
    Value: !GetAtt OrderServiceLambdaFunction.Arn # Lấy ARN của hàm Order Service
    Export:
      Name: ${self:service}-${self:provider.stage}-OrderServiceLambdaFunctionArn # Tên export để import từ stack khác

  ProductServiceLambdaFunctionArn:
    Description: Product Service Lambda Function ARN # Mô tả output
    Value: !GetAtt ProductServiceLambdaFunction.Arn # Lấy ARN của hàm Product Service
    Export:
      Name: ${self:service}-${self:provider.stage}-ProductServiceLambdaFunctionArn # Tên export để import từ stack khác

  AuthServiceLambdaFunctionArn:
    Description: Auth Service Lambda Function ARN # Mô tả output
    Value: !GetAtt AuthServiceLambdaFunction.Arn # Lấy ARN của hàm Auth Service
    Export:
      Name: ${self:service}-${self:provider.stage}-AuthServiceLambdaFunctionArn # Tên export để import từ stack khác

  CognitoAuthorizerLambdaFunctionArn:
    Description: Cognito Authorizer Lambda Function ARN # Mô tả output
    Value: !GetAtt CognitoAuthorizerLambdaFunction.Arn # Lấy ARN của hàm Cognito Authorizer
    Export:
      Name: ${self:service}-${self:provider.stage}-CognitoAuthorizerLambdaFunctionArn # Tên export để import từ stack khác

  # Khai báo output cho thông tin môi trường - xuất thông tin cấu hình
  ServiceName:
    Description: Service Name # Mô tả output
    Value: ${self:service} # Lấy tên service từ config
    Export:
      Name: ${self:service}-${self:provider.stage}-ServiceName # Tên export để import từ stack khác

  Stage:
    Description: Deployment Stage # Mô tả output
    Value: ${self:provider.stage} # Lấy tên stage từ config
    Export:
      Name: ${self:service}-${self:provider.stage}-Stage # Tên export để import từ stack khác

  Region:
    Description: AWS Region # Mô tả output
    Value: ${self:provider.region} # Lấy region từ config
    Export:
      Name: ${self:service}-${self:provider.stage}-Region # Tên export để import từ stack khác 