# Product Service
productService:
  handler: lambda/product-service/product-service.handler
  # warmup:
  #   default:
  #     enabled: true
  environment:
    USER_SERVICE_NAME: ${self:service}-${self:provider.stage}-userService
  events:
    # Public endpoints
    - http:
        path: /products
        method: get
        cors: true
    - http:
        path: /products/{productId}
        method: get
        cors: true
    - http:
        path: /products/category/{category}
        method: get
        cors: true
    - http:
        path: /products/search
        method: post
        cors: true
    
    # Protected endpoints
    - http:
        path: /products
        method: post
        cors: true
        authorizer:
          name: cognitoAuthorizer
          type: request
          resultTtlInSeconds: 300
    - http:
        path: /products/{productId}
        method: put
        cors: true
        authorizer:
          name: cognitoAuthorizer
          type: request
          resultTtlInSeconds: 300
    - http:
        path: /products/{productId}
        method: delete
        cors: true
        authorizer:
          name: cognitoAuthorizer
          type: request
          resultTtlInSeconds: 300 