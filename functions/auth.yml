# Cognito Authorizer
cognitoAuthorizer:
  handler: lambda/cognito-authorizer/cognito-authorizer.handler
  environment:
    USER_SERVICE_NAME: ${self:service}-${self:provider.stage}-userService

# Auth Service
authService:
  handler: lambda/auth-service/auth-service.handler
  # warmup:
  #   default:
  #     enabled: true
  environment:
    USER_SERVICE_NAME: ${self:service}-${self:provider.stage}-userService
  events:
    - http:
        path: /auth/login
        method: post
        cors: true
    - http:
        path: /auth/register
        method: post
        cors: true
    - http:
        path: /auth/refresh
        method: post
        cors: true
    - http:
        path: /auth/logout
        method: post
        cors: true
    - http:
        path: /auth/forgot-password
        method: post
        cors: true
    - http:
        path: /auth/reset-password
        method: post
        cors: true
    - http:
        path: /auth/verify-email
        method: post
        cors: true
    - http:
        path: /auth/resend-verification
        method: post
        cors: true 